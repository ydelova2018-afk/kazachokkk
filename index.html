<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Карта Project Zomboid — Kazachokkk</title>
<style>
  :root{--bg:#0d1014;--panel:rgba(18,22,28,.94);--panel2:rgba(26,32,40,.9);
    --line:rgba(255,255,255,.09);--txt:#e7edf3;--dim:#8b98a6;--accent:#ff3b1f;--ok:#2f9e5f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  #viewer{position:fixed;inset:0;background:#0a0d10}
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:5}

  #brand{position:fixed;left:14px;bottom:14px;z-index:22;display:flex;align-items:center;gap:12px;
    padding:8px 18px 8px 8px;border-radius:44px;background:rgba(12,15,19,.86);
    border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);pointer-events:none;user-select:none;
    box-shadow:0 8px 32px rgba(0,0,0,.6)}
  #brand img{width:48px;height:48px;border-radius:50%;display:block;flex:0 0 auto;
    box-shadow:0 0 0 2px rgba(198,155,84,.6),0 0 20px rgba(198,155,84,.28)}
  #brand .txt{display:flex;flex-direction:column;line-height:1.25}
  #brand .l1{font-weight:700;font-size:14.5px;letter-spacing:.2px;white-space:nowrap;
    display:flex;align-items:center;gap:6px}
  #brand .tag{color:#c69b54;font-weight:700}
  #brand .nm{background:linear-gradient(180deg,#fff,#c9d2dc);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #brand .l2{font-size:11px;color:#95a2b0;letter-spacing:.3px;white-space:nowrap}

  #topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;display:flex;align-items:center;
    gap:9px;padding:0 14px;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,13,16,.94),rgba(10,13,16,.5) 70%,transparent)}
  #topbar>*{pointer-events:auto}
  .floors{display:flex;align-items:center;gap:3px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:3px}
  .floors .lbl{font-size:10px;color:var(--dim);padding:0 5px 0 3px;text-transform:uppercase;
    letter-spacing:.8px}
  .floors button{width:26px;height:25px;border:0;border-radius:6px;background:transparent;
    color:var(--dim);font:600 12px/1 inherit;cursor:pointer;transition:.13s}
  .floors button:hover{background:rgba(255,255,255,.08);color:#fff}
  .floors button.on{background:var(--accent);color:#fff;box-shadow:0 0 12px rgba(255,59,31,.5)}

  .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 12px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel);color:var(--txt);
    font:500 12.5px/1 inherit;cursor:pointer;transition:.13s;white-space:nowrap}
  .btn:hover{background:var(--panel2);border-color:rgba(255,255,255,.18)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff;
    box-shadow:0 3px 16px rgba(255,59,31,.3)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn svg{width:14px;height:14px;flex:0 0 auto}

  #viewBadge{display:none;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:20px;
    background:rgba(43,120,255,.15);border:1px solid rgba(90,150,255,.4);color:#9dc2ff;
    font-size:11.5px;font-weight:600;white-space:nowrap}
  #viewBadge.show{display:flex}

  #side{position:fixed;top:60px;right:12px;bottom:14px;width:296px;z-index:20;
    display:flex;flex-direction:column;gap:9px;transition:transform .22s,opacity .22s}
  #side.hidden{transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;
    display:flex;flex-direction:column;min-height:0}
  .card h3{margin:0;padding:10px 12px;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;
    color:var(--dim);border-bottom:1px solid var(--line);font-weight:600;
    display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
  .card h3 .n{background:rgba(255,59,31,.18);color:#ff7a45;padding:1px 7px;border-radius:20px;
    font-size:10px;letter-spacing:0}
  #zonesCard{flex:1}
  #list{overflow-y:auto;flex:1;padding:5px;min-height:46px}
  #list::-webkit-scrollbar{width:7px}
  #list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
  .empty{padding:18px 13px;text-align:center;color:var(--dim);font-size:12px;line-height:1.6}
  .zrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;transition:.12s}
  .zrow:hover{background:rgba(255,255,255,.05)}
  .zrow.on{background:rgba(255,59,31,.13);border-color:rgba(255,59,31,.35)}
  .zrow .sw{width:13px;height:13px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 8px currentColor;
    overflow:hidden;display:grid;place-items:center}
  .zrow .sw img{width:100%;height:100%;object-fit:cover;border-radius:3px}
  .zrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .zrow .eye{border:0;background:transparent;color:var(--dim);cursor:pointer;padding:2px;
    line-height:0;border-radius:5px}
  .zrow .eye:hover{color:#fff;background:rgba(255,255,255,.1)}
  .zrow.off .nm,.zrow.off .sw{opacity:.35}

  .props{padding:10px 12px;display:none;flex-direction:column;gap:8px;
    border-top:1px solid var(--line);flex:0 0 auto}
  .props.show{display:flex}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
  .field input[type=text],.field textarea{width:100%;border-radius:7px;border:1px solid var(--line);
    background:rgba(0,0,0,.28);color:var(--txt);padding:7px 9px;font:12.5px inherit;outline:none;
    resize:none}
  .field textarea{min-height:52px;line-height:1.4}
  .field input:focus,.field textarea:focus{border-color:rgba(255,59,31,.5)}
  .row{display:flex;gap:6px;align-items:center}
  .row .btn{flex:1;justify-content:center;height:30px;font-size:12px}
  .swatches{display:flex;gap:5px;flex-wrap:wrap}
  .swatches button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;
    cursor:pointer;padding:0;transition:.12s}
  .swatches button:hover{transform:scale(1.12)}
  .swatches button.on{border-color:#fff;box-shadow:0 0 9px currentColor}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;
    background:rgba(255,255,255,.16);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px rgba(255,59,31,.22)}
  .noteimg{width:100%;height:74px;border-radius:8px;border:1px dashed rgba(255,255,255,.18);
    display:grid;place-items:center;cursor:pointer;overflow:hidden;background:rgba(0,0,0,.2);
    color:var(--dim);font-size:11.5px;text-align:center;padding:4px;position:relative}
  .noteimg img{width:100%;height:100%;object-fit:contain}
  .noteimg .del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);border:0;
    color:#ff8b7a;border-radius:5px;width:20px;height:20px;cursor:pointer;line-height:1}

  .infoBody{padding:11px 12px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .infoHead{display:flex;align-items:center;gap:8px}
  .infoDot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 9px currentColor}
  .infoName{font-size:13.5px;font-weight:600;line-height:1.3;word-break:break-word}
  .infoLogo{width:100%;max-height:130px;object-fit:contain;border-radius:9px;
    background:rgba(0,0,0,.25);border:1px solid var(--line);padding:5px}
  .infoText{font-size:12.5px;line-height:1.5;color:#cfd9e3;white-space:pre-wrap;word-break:break-word}
  .infoMeta{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}

  #coords{position:fixed;left:14px;bottom:78px;z-index:21;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:6px 11px;
    font:11.5px/1 ui-monospace,Menlo,monospace;color:var(--dim);cursor:pointer;white-space:nowrap}
  #coords b{color:var(--txt);font-weight:600}

  #hint{position:fixed;left:50%;top:62px;transform:translateX(-50%) translateY(-12px);z-index:30;
    background:rgba(255,59,31,.95);color:#fff;padding:8px 16px;border-radius:20px;
    font-size:12px;font-weight:600;box-shadow:0 6px 26px rgba(255,59,31,.45);
    opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;
    max-width:92vw;flex-wrap:wrap;justify-content:center}
  #hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #hint .k{background:rgba(0,0,0,.22);border-radius:5px;padding:2px 6px;font-size:11px}

  #toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);z-index:40;
    background:rgba(24,30,38,.97);border:1px solid var(--line);color:#fff;padding:10px 17px;
    border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;
    box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:80vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #loading{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:var(--bg);transition:opacity .4s}
  #loading.gone{opacity:0;pointer-events:none;display:none}
  .spin{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--accent);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  body.drawing #viewer{cursor:crosshair}
  body.placing #viewer{cursor:copy}

  body.viewonly #btnDraw,
  body.viewonly #btnNote,
  body.viewonly #btnLoad,
  body.viewonly #btnSave,
  body.viewonly #btnJson,
  body.viewonly #btnShare{display:none!important}
  body.viewonly #coords{cursor:default}

  @media (max-width:860px){
    #side{width:250px;top:56px;bottom:auto;height:min(58vh,430px)}
    #brand{padding:6px 13px 6px 6px;gap:9px}
    #brand img{width:38px;height:38px}
    #brand .l1{font-size:12.5px}
    #brand .l2{font-size:10px}
    #topbar{gap:6px;padding:0 8px;height:48px}
    .floors .lbl{display:none}
    .btn span.lbl{display:none}
    .btn{padding:0 9px}
  }
</style>
</head>

    <div class="infoBody" id="infoBody"></div>
  </div>
</div>

<div id="coords">клетка <b>—</b></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="loading"><div class="spin"></div></div>

<input type="file" id="fileInput" accept="application/json,.json" style="display:none">
<input type="file" id="imgInput" accept="image/*" style="display:none">

<script>
(function(){
'use strict';

/* Чистая копия разметки, снятая ДО запуска движка карты.
   Из неё собирается файл для игроков — иначе в него попадают служебные элементы
   OpenSeadragon (холсты, кнопки этажей), и файл ломается: чёрный экран, задвоенный интерфейс. */
var PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

/* ======================= константы ======================= */
var W = 2314368, H = 1019040, TILE = 1024, MAXLEVEL = 22;
var ROOT = 'https://tiles.projectzomboidmap.com/maps/b42.20.2-r1/';
var MAP = { sqr: 128 };
var FLOORS = [0,1,2,3,4,5,6,7];
var ZS = 1280;
var COLORS = ['#ff3b1f','#ff7a1f','#ffd21f','#ff1f8f','#a020ff','#1fa8ff','#1fff9c'];

/* ======================= состояние ======================= */
var state = {
  floor: 0,
  zones: [],
  notes: [],
  sel: null,
  drawing: null,
  hover: null,
  hoverEdge: null,
  color: COLORS[0],
  opacity: 0.42,
  placingNote: false,
  readonly: false
};

var viewer = null, ctx = null, dpr = 1, OSD = null;
var floorItems = {};
var noteImgs = {};

/* ======================= утилиты ======================= */
function $(id){ return document.getElementById(id); }
function rgba(hex,a){
  var n=parseInt(String(hex).replace('#',''),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
var toastT=null;
function toast(m){
  var t=$('toast'); if(!t) return;
  t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2400);
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function clamp01(v){ return Math.max(0,Math.min(1,v)); }

/* ======================= игра <-> картинка ======================= */
function gameToImage(gx,gy,z){
  return { x: (gx-gy)*(MAP.sqr/2),
           y: (gx+gy)*(MAP.sqr/4) - 1.5*(MAP.sqr/2)*(z||0) };
}
function imageToGame(ix,iy,z){
  var A = 2*ix/MAP.sqr;
  var B = 4*(iy + 1.5*(MAP.sqr/2)*(z||0))/MAP.sqr;
  return { x: Math.floor((A+B)/2), y: Math.floor((B-A)/2) };
}
/* смещение картинки внутри полного полотна тайлов */
var X0 = 1036288, Y0 = -139296;
function imgShift(z){ return { x:X0, y:Y0 - 1.5*MAP.sqr*(z||0) }; }

/* ======================= тайлы ======================= */
function layerSource(floor){
  return new OSD.DziTileSource({
    width:W, height:H, tileSize:TILE, tileOverlap:0,
    tilesUrl: ROOT+'base/layer'+floor+'_files/',
    fileFormat: floor===0 ? 'jpg' : 'webp',
    minLevel:0, maxLevel:MAXLEVEL
  });
}
function refItem(){
  if(!viewer) return null;
  var w=viewer.world, n=w.getItemCount();
  for(var i=n-1;i>=0;i--){
    var it=w.getItemAt(i);
    if(it && it.source && it.source.dimensions && it.source.dimensions.x>0) return it;
  }
  return n>0 ? w.getItemAt(0) : null;
}

/* аффинное преобразование: нормализованные координаты картинки <-> пиксели экрана */
var AF = null;
function updateAF(){
  var it = refItem();
  if(!it){ AF=null; return; }
  var p0 = it.imageToViewportCoordinates(0,0);
  var pX = it.imageToViewportCoordinates(W,0);
  var pY = it.imageToViewportCoordinates(0,H);
  var s0 = viewer.viewport.pixelFromPoint(p0,true);
  var sX = viewer.viewport.pixelFromPoint(pX,true);
  var sY = viewer.viewport.pixelFromPoint(pY,true);
  var ux=sX.x-s0.x, uy=sX.y-s0.y, vx=sY.x-s0.x, vy=sY.y-s0.y;
  var det=ux*vy-uy*vx;
  if(!det){ AF=null; return; }
  AF={ ux:ux, uy:uy, vx:vx, vy:vy, s0:s0, det:det };
}
function n2s(nx,ny){
  if(!AF) return {x:-9999,y:-9999};
  return { x: AF.s0.x + nx*AF.ux + ny*AF.vx,
           y: AF.s0.y + nx*AF.uy + ny*AF.vy };
}
function s2n(sx,sy){
  if(!AF) return [0,0];
  var X=sx-AF.s0.x, Y=sy-AF.s0.y;
  return [ clamp01((X*AF.vy-Y*AF.vx)/AF.det), clamp01((Y*AF.ux-X*AF.uy)/AF.det) ];
}

/* ======================= геометрия ======================= */
function distToSeg(px,py,ax,ay,bx,by){
  var dx=bx-ax, dy=by-ay, len=dx*dx+dy*dy;
  var t = len ? Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len)) : 0;
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
}
/* нормализованные координаты искажены (W != H) — расстояния считаем в пикселях картинки */
function toImg(p){ return [p[0]*W, p[1]*H]; }
function ringImg(r){ return r.map(toImg); }

function pointInRing(px,py,ring){
  var ins=false;
  for(var i=0,j=ring.length-1;i<ring.length;j=i++){
    var xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins;
  }
  return ins;
}
function pointInPolys(px,py,polys){
  var inside=false;
  for(var k=0;k<polys.length;k++) if(pointInRing(px,py,polys[k])) inside=!inside;
  return inside;
}

/* ======================= рисование ======================= */
var rafPending=false;
function scheduleDraw(){
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(function(){ rafPending=false; redraw(); });
}
function ringPath(ring){
  var p=n2s(ring[0][0],ring[0][1]);
  ctx.moveTo(p.x,p.y);
  for(var i=1;i<ring.length;i++){
    var q=n2s(ring[i][0],ring[i][1]);
    ctx.lineTo(q.x,q.y);
  }
  ctx.closePath();
}
function redraw(){
  if(!ctx||!viewer) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  updateAF();
  if(!AF) return;

  state.zones.forEach(function(z){
    if(z.floor!==state.floor || z.on===false) return;
    var sel=(z===state.sel);
    ctx.save();
    ctx.beginPath();
    z.polys.forEach(ringPath);
    ctx.shadowColor=rgba(z.color,0.95);
    ctx.shadowBlur=sel?30:20;
    ctx.lineJoin='round';
    ctx.lineWidth=sel?3:1.7;
    ctx.strokeStyle=sel?'#ffffff':rgba(z.color,0.95);
    ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle=rgba(z.color,z.o);
    ctx.fill('evenodd');
    ctx.restore();

    if(sel){
      z.polys.forEach(function(ring){
        ring.forEach(function(pt){
          var px=n2s(pt[0],pt[1]);
          ctx.beginPath();
          ctx.arc(px.x,px.y,5,0,6.2832);
          ctx.fillStyle='#fff'; ctx.fill();
          ctx.lineWidth=2; ctx.strokeStyle=rgba(z.color,1); ctx.stroke();
        });
      });
      if(state.hoverEdge && !state.readonly){
        var hp=n2s(state.hoverEdge.point[0],state.hoverEdge.point[1]);
        ctx.beginPath();
        ctx.arc(hp.x,hp.y,7,0,6.2832);
        ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fill();
        ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(hp.x-3.5,hp.y); ctx.lineTo(hp.x+3.5,hp.y);
        ctx.moveTo(hp.x,hp.y-3.5); ctx.lineTo(hp.x,hp.y+3.5);
        ctx.lineWidth=1.6; ctx.strokeStyle='#fff'; ctx.stroke();
      }
    }
  });

  state.notes.forEach(function(n){
    if(n.floor!==state.floor || n.on===false) return;
    drawNote(n, n===state.sel);
  });

  if(state.drawing){
    var cur=state.drawing.cur;
    if(cur.length){
      var pts=cur.map(function(p){ return n2s(p[0],p[1]); });
      var hov=state.hover?n2s(state.hover[0],state.hover[1]):null;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0].x,pts[0].y);
      for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
      if(hov) ctx.lineTo(hov.x,hov.y);
      ctx.strokeStyle='rgba(255,255,255,.85)';
      ctx.lineWidth=2; ctx.setLineDash([6,5]); ctx.stroke();
      ctx.restore();

      if(pts.length>=3){
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0].x,pts[0].y);
        for(var j=1;j<pts.length;j++) ctx.lineTo(pts[j].x,pts[j].y);
        ctx.closePath();
        ctx.fillStyle=rgba(state.color,state.opacity*0.55);
        ctx.fill();
        ctx.restore();
      }
      pts.forEach(function(p,i){
        ctx.beginPath();
        ctx.arc(p.x,p.y,i===0?6:4,0,6.2832);
        ctx.fillStyle=i===0?'#fff':'rgba(255,255,255,.9)';
        ctx.fill();
        ctx.lineWidth=2; ctx.strokeStyle=rgba(state.color,1); ctx.stroke();
      });
    }
  }
}

function drawNote(n,sel){
  var p=n2s(n.nx,n.ny);
  if(p.x<-220||p.y<-220||p.x>innerWidth+220||p.y>innerHeight+220) return;
  var r=sel?23:20;
  ctx.save();

  ctx.beginPath();
  ctx.arc(p.x,p.y+r*0.7,r*0.95,0,6.2832);
  ctx.fillStyle='rgba(0,0,0,.32)'; ctx.fill();

  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,6.2832);
  ctx.fillStyle='rgba(14,18,23,.94)'; ctx.fill();

  var img=n.img?noteImgs[n.id]:null;
  if(img && img.complete && img.naturalWidth){
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x,p.y,r-2,0,6.2832);
    ctx.clip();
    var s=Math.min((r*2-4)/img.naturalWidth,(r*2-4)/img.naturalHeight);
    ctx.drawImage(img,p.x-img.naturalWidth*s/2,p.y-img.naturalHeight*s/2,
                  img.naturalWidth*s,img.naturalHeight*s);
    ctx.restore();
  }else{
    ctx.fillStyle=rgba(n.color||'#ff3b1f',.9);
    ctx.font='700 '+(r*0.85)+'px -apple-system,Segoe UI,Roboto,Arial,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText((n.n||'?').trim().charAt(0).toUpperCase()||'?',p.x,p.y+1);
  }

  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,6.2832);
  ctx.lineWidth=sel?3:2;
  ctx.strokeStyle=sel?'#fff':rgba(n.color||'#ff3b1f',.95);
  ctx.stroke();

  var label=n.n||'';
  if(label){
    ctx.font='600 12px -apple-system,Segoe UI,Roboto,Arial,sans-serif';
    var tw=ctx.measureText(label).width;
    var bx=p.x-tw/2-6, by=p.y+r+5;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx,by,tw+12,20,6); else ctx.rect(bx,by,tw+12,20);
    ctx.fillStyle='rgba(10,13,16,.88)'; ctx.fill();
    ctx.strokeStyle=rgba(n.color||'#ff3b1f',.55); ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#eef3f8'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,p.x,by+10.5);
  }
  ctx.restore();
}

/* ======================= попадания ======================= */
function hitZoneScreen(sx,sy){
  for(var i=state.zones.length-1;i>=0;i--){
    var z=state.zones[i];
    if(z.floor!==state.floor || z.on===false) continue;
    for(var k=0;k<z.polys.length;k++){
      var ring=z.polys[k], minD=Infinity;
      for(var j=0;j<ring.length;j++){
        var a=n2s(ring[j][0],ring[j][1]);
        var b=n2s(ring[(j+1)%ring.length][0],ring[(j+1)%ring.length][1]);
        var d=distToSeg(sx,sy,a.x,a.y,b.x,b.y);
        if(d<minD) minD=d;
      }
      if(minD<8) return z;
    }
    var n=s2n(sx,sy);
    if(pointInPolys(n[0],n[1],z.polys)) return z;
  }
  return null;
}
function hitNote(sx,sy){
  for(var i=state.notes.length-1;i>=0;i--){
    var n=state.notes[i];
    if(n.floor!==state.floor || n.on===false) continue;
    var p=n2s(n.nx,n.ny);
    if(Math.hypot(sx-p.x,sy-p.y)<26) return n;
  }
  return null;
}
function hitVertex(sx,sy){
  if(!state.sel||!state.sel.polys) return null;
  var polys=state.sel.polys;
  for(var k=0;k<polys.length;k++){
    for(var i=0;i<polys[k].length;i++){
      var p=n2s(polys[k][i][0],polys[k][i][1]);
      if(Math.hypot(sx-p.x,sy-p.y)<11) return {pi:k,vi:i};
    }
  }
  return null;
}
function edgeHit(sx,sy){
  if(!state.sel||!state.sel.polys) return null;
  var best=null;
  state.sel.polys.forEach(function(ring,pi){
    for(var i=0;i<ring.length;i++){
      var a=n2s(ring[i][0],ring[i][1]);
      var b=n2s(ring[(i+1)%ring.length][0],ring[(i+1)%ring.length][1]);
      var d=distToSeg(sx,sy,a.x,a.y,b.x,b.y);
      if(d<10 && (!best||d<best.d)){
        var dx=b.x-a.x, dy=b.y-a.y, len=dx*dx+dy*dy;
        var t=len?Math.max(0,Math.min(1,((sx-a.x)*dx+(sy-a.y)*dy)/len)):0;
        best={ pi:pi, vi:i, d:d, point:s2n(a.x+dx*t,a.y+dy*t) };
      }
    }
  });
  return best;
}

/* ======================= объединение зон ======================= */
function pcUnion(a,b){
  if(!window.polygonClipping) return null;
  try{ return window.polygonClipping.union([a.polys],[b.polys]); }
  catch(e){ return null; }
}
function bboxOf(polys){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  polys.forEach(function(ring){ ring.forEach(function(p){
    var q=toImg(p);
    if(q[0]<x0)x0=q[0]; if(q[1]<y0)y0=q[1];
    if(q[0]>x1)x1=q[0]; if(q[1]>y1)y1=q[1];
  });});
  return [x0,y0,x1,y1];
}
function bboxGap(A,B){
  var a=bboxOf(A), b=bboxOf(B);
  var dx=Math.max(0, Math.max(a[0],b[0])-Math.min(a[2],b[2]));
  var dy=Math.max(0, Math.max(a[1],b[1])-Math.min(a[3],b[3]));
  return Math.hypot(dx,dy);
}
function zoneGap(a,b){
  var best=Infinity;
  function scan(pa,pb){
    pa.forEach(function(ra0){
      var ra=ringImg(ra0);
      ra.forEach(function(p){
        pb.forEach(function(rb0){
          var rb=ringImg(rb0);
          for(var j=0;j<rb.length;j++){
            var d=distToSeg(p[0],p[1],rb[j][0],rb[j][1],
                            rb[(j+1)%rb.length][0],rb[(j+1)%rb.length][1]);
            if(d<best) best=d;
          }
        });
      });
    });
  }
  scan(a.polys,b.polys); scan(b.polys,a.polys);
  return best;
}

/* «соседние» = касаются, пересекаются или между ними не больше 3 клеток карты.
   Допуск в клетках не зависит от масштаба экрана. 1 клетка = 64 px картинки. */
var MERGE_GAP_TILES = 3;
function mergeGapPx(){ return MERGE_GAP_TILES*(MAP.sqr/2); }

function zonesTouch(a,b){
  var GAP=mergeGapPx();
  if(bboxGap(a.polys,b.polys) > GAP*2) return false;
  if(zoneGap(a,b) <= GAP) return true;
  return pointInPolys(a.polys[0][0][0],a.polys[0][0][1],b.polys) ||
         pointInPolys(b.polys[0][0][0],b.polys[0][0][1],a.polys);
}
function convexHull(pts){
  var P=pts.slice().sort(function(p,q){ return p[0]-q[0]||p[1]-q[1]; });
  if(P.length<3) return P;
  function cross(o,a,b){ return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); }
  var lo=[], up=[], i;
  for(i=0;i<P.length;i++){
    while(lo.length>=2 && cross(lo[lo.length-2],lo[lo.length-1],P[i])<=0) lo.pop();
    lo.push(P[i]);
  }
  for(i=P.length-1;i>=0;i--){
    while(up.length>=2 && cross(up[up.length-2],up[up.length-1],P[i])<=0) up.pop();
    up.push(P[i]);
  }
  lo.pop(); up.pop();
  return lo.concat(up);
}
function mergeZones(a,b){
  var un=pcUnion(a,b);
  var target=a, drop=b;
  if(un && un.length){
    var rings=[];
    un.forEach(function(poly){
      if(poly && poly.length) rings.push(poly[0].map(function(p){ return [p[0],p[1]]; }));
    });
    if(rings.length) target.polys=rings;
  }else{
    var all=a.polys.concat(b.polys).reduce(function(s,r){ return s.concat(r); },[]);
    target.polys=[convexHull(all)];
  }
  state.zones=state.zones.filter(function(z){ return z!==drop; });
  if(state.sel===drop) state.sel=target;
  return target;
}
function autoMergeAll(silent){
  var changed=false, guard=0;
  do{
    changed=false;
    outer:
    for(var i=0;i<state.zones.length;i++){
      for(var j=i+1;j<state.zones.length;j++){
        var a=state.zones[i], b=state.zones[j];
        if(a.floor!==b.floor) continue;
        if(zonesTouch(a,b)){
          var m=mergeZones(a,b);
          changed=true;
          if(!silent) toast('Зоны объединены: «'+m.n+'»');
          break outer;
        }
      }
    }
    guard++;
  }while(changed && guard<40);
  return changed;
}

/* ======================= режим просмотра ======================= */
function setReadonly(on){
  state.readonly=!!on;
  document.body.classList.toggle('viewonly',state.readonly);
  var badge=$('viewBadge');
  if(badge) badge.classList.toggle('show',state.readonly);
  if(state.readonly){
    state.drawing=null;
    state.placingNote=false;
    state.hoverEdge=null;
    document.body.classList.remove('drawing','placing');
    var hint=$('hint');
    if(hint){ hint.classList.remove('show'); hint.innerHTML=''; }
  }
  renderList(); renderProps();
  if(state.readonly) renderInfo(state.sel);
  else renderInfo(null);
  scheduleDraw();
}

function renderInfo(obj){
  var card=$('infoCard'), body=$('infoBody');
  if(!card||!body) return;
  if(!obj || !state.readonly){ card.style.display='none'; body.innerHTML=''; return; }
  card.style.display='flex';
  body.innerHTML='';

  var isNote=state.notes.indexOf(obj)>=0;

  var head=document.createElement('div'); head.className='infoHead';
  var dot=document.createElement('span'); dot.className='infoDot';
  dot.style.background=obj.color||'#ff3b1f';
  dot.style.color=obj.color||'#ff3b1f';
  var nm=document.createElement('div'); nm.className='infoName';
  nm.textContent=obj.n||(isNote?'Заметка':'Зона');
  head.appendChild(dot); head.appendChild(nm);
  body.appendChild(head);

  if(isNote && obj.img){
    var im=document.createElement('img');
    im.className='infoLogo'; im.src=obj.img; im.alt='';
    body.appendChild(im);
  }
  if(isNote && obj.text){
    var tx=document.createElement('div');
    tx.className='infoText'; tx.textContent=obj.text;
    body.appendChild(tx);
  }
  var meta=document.createElement('div'); meta.className='infoMeta';
  meta.textContent=(isNote?'Заметка фракции':'Красная зона')+(obj.floor?' · этаж '+obj.floor:'');
  body.appendChild(meta);
}

/* ======================= панель ======================= */
function renderList(){
  var box=$('list');
  var total=state.zones.length+state.notes.length;
  $('zcount').textContent=total;
  if(!total){
    box.innerHTML='<div class="empty">Пока пусто.<br>Нажмите «Зона» или «Заметка».</div>';
    return;
  }
  box.innerHTML='';
  var items=state.zones.map(function(o){ return {t:'z',o:o}; })
    .concat(state.notes.map(function(o){ return {t:'n',o:o}; }));

  items.slice().reverse().forEach(function(it){
    var o=it.o;
    var row=document.createElement('div');
    row.className='zrow'+(o===state.sel?' on':'')+(o.on===false?' off':'');
    var sw = (it.t==='n' && o.img)
      ? '<span class="sw" style="color:'+(o.color||'#ff3b1f')+'"><img src="'+o.img+'" alt=""></span>'
      : '<span class="sw" style="background:'+(o.color||'#ff3b1f')+';color:'+(o.color||'#ff3b1f')+'"></span>';

    row.innerHTML=sw+'<span class="nm"></span>'+
      '<button class="eye" title="Показать/скрыть">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+
      (o.on===false
        ?'<path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.2A9.9 9.9 0 0112 5c5 0 9 4.5 9 7a11 11 0 01-2.4 3.5M6.5 6.7C3.9 8.3 3 10.2 3 12c0 2.5 4 7 9 7a10 10 0 003.6-.7"/>'
        :'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>')+
      '</svg></button>';

    row.querySelector('.nm').textContent=(it.t==='n'?'◆ ':'')+o.n;

    row.addEventListener('click',function(ev){
      if(ev.target.closest('.eye')){
        o.on=o.on===false;
        renderList(); scheduleDraw(); return;
      }
      select(o);
      if(o.floor!==state.floor) setFloor(o.floor);
    });
    box.appendChild(row);
  });
}

function select(obj){
  state.sel=obj||null;
  state.hoverEdge=null;
  renderList(); renderProps();
  if(state.readonly) renderInfo(state.sel);
  scheduleDraw();
}

function renderProps(){
  var p=$('props');
  if(state.readonly || !state.sel){ p.classList.remove('show'); return; }
  p.classList.add('show');

  var isNote=state.notes.indexOf(state.sel)>=0;
  $('propsZone').style.display=isNote?'none':'flex';
  $('propsNote').style.display=isNote?'flex':'none';
  $('lblName').textContent=isNote?'Название заметки':'Название зоны';
  $('objName').value=state.sel.n||'';

  if(isNote){
    $('noteText').value=state.sel.text||'';
    renderNoteImg();
  }else{
    var o=state.sel.o||0.42;
    $('opacity').value=Math.round(o*100);
    $('opVal').textContent=Math.round(o*100)+'%';
    Array.prototype.forEach.call($('swatches').children,function(b){
      b.classList.toggle('on',b.dataset.c===state.sel.color);
    });
  }
}

function renderNoteImg(){
  var box=$('noteImgBox');
  if(!box) return;
  var img=state.sel&&state.sel.img;
  if(img){
    box.innerHTML='<img src="'+img+'" alt=""><button class="del" title="Убрать">×</button>';
    box.querySelector('.del').addEventListener('click',function(ev){
      ev.stopPropagation();
      state.sel.img=null;
      renderNoteImg(); renderList(); scheduleDraw();
    });
  }else{
    box.innerHTML='Нажмите, чтобы выбрать картинку';
  }
}

function buildSwatches(){
  var box=$('swatches');
  COLORS.forEach(function(c){
    var b=document.createElement('button');
    b.style.background=c; b.dataset.c=c;
    b.addEventListener('click',function(){
      if(state.readonly) return;
      if(state.sel && state.zones.indexOf(state.sel)>=0){
        state.sel.color=c;
        renderProps(); renderList(); scheduleDraw();
      }else{
        state.color=c;
      }
    });
    box.appendChild(b);
  });
}

/* ======================= этажи ======================= */
function buildFloors(){
  var box=$('floors');
  FLOORS.forEach(function(f){
    var b=document.createElement('button');
    b.textContent=f; b.dataset.f=f;
    b.className=(f===state.floor)?'on':'';
    b.addEventListener('click',function(){ setFloor(f); });
    box.appendChild(b);
  });
}
function setFloor(f){
  f=Math.max(FLOORS[0],Math.min(FLOORS[FLOORS.length-1],f));
  state.floor=f;
  Array.prototype.forEach.call($('floors').children,function(b){
    if(b.dataset&&b.dataset.f) b.classList.toggle('on',+b.dataset.f===f);
  });
  if(state.drawing) cancelDrawing();
  syncFloors();
  renderList();
  scheduleDraw();
}
function syncFloors(){
  var want=[];
  for(var f=0;f<=state.floor;f++) want.push(f);

  Object.keys(floorItems).forEach(function(k){
    if(want.indexOf(+k)===-1){
      var rec=floorItems[k];
      rec.dead=true;
      if(rec.item){ try{ viewer.world.removeItem(rec.item); }catch(_){} }
      delete floorItems[k];
    }
  });

  want.forEach(function(f){
    if(floorItems[f]) return;
    var rec={ status:'loading', item:null, dead:false };
    floorItems[f]=rec;
    viewer.addTiledImage({
      tileSource: layerSource(f),
      x:0,y:0,width:1,opacity:1,
      success:function(e){
        if(rec.dead){ try{ viewer.world.removeItem(e.item); }catch(_){} return; }
        rec.item=e.item; rec.status='ready';
        hideLoading(); scheduleDraw();
      },
      error:function(){ rec.status='error'; hideLoading(); }
    });
  });
}
function hideLoading(){
  var l=$('loading');
  if(l){ l.classList.add('gone'); }
}
function waitFirstFloor(){
  return new Promise(function(res){
    var t0=Date.now();
    (function poll(){
      if(floorItems[0] && floorItems[0].status==='ready' && refItem()) return res(true);
      if(Date.now()-t0>9000) return res(false);
      setTimeout(poll,80);
    })();
  });
}

/* ======================= взаимодействие ======================= */
var drag=null, draggingNote=null, downPt=null;

function localXY(e){
  var r=viewer.element.getBoundingClientRect();
  return { x:e.clientX-r.left, y:e.clientY-r.top };
}

function attachInteraction(){
  var el=viewer.element;

  el.addEventListener('pointerdown',function(e){
    if(e.button!==0) return;
    var p=localXY(e);
    downPt={x:p.x,y:p.y,moved:false};
    if(state.readonly) return;

    var nt=hitNote(p.x,p.y);
    if(nt && !state.placingNote){
      select(nt);
      draggingNote=nt;
      viewer.setMouseNavEnabled(false);
      e.stopPropagation(); e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      return;
    }

    var vi=hitVertex(p.x,p.y);
    if(vi!==null){
      drag={ zone:state.sel, pi:vi.pi, vi:vi.vi };
      viewer.setMouseNavEnabled(false);
      e.stopPropagation(); e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
    }
  },true);

  el.addEventListener('pointermove',function(e){
    var p=localXY(e);
    if(downPt && (Math.abs(p.x-downPt.x)>4||Math.abs(p.y-downPt.y)>4)) downPt.moved=true;

    if(draggingNote){
      var q=s2n(p.x,p.y);
      draggingNote.nx=q[0]; draggingNote.ny=q[1];
      scheduleDraw(); e.stopPropagation(); return;
    }
    if(drag){
      var n=s2n(p.x,p.y);
      drag.zone.polys[drag.pi][drag.vi]=[n[0],n[1]];
      scheduleDraw(); e.stopPropagation(); return;
    }
    if(state.drawing){
      var h=s2n(p.x,p.y);
      state.hover=[h[0],h[1]];
      scheduleDraw(); return;
    }
    if(!state.readonly && state.sel && state.zones.indexOf(state.sel)>=0){
      var he=edgeHit(p.x,p.y);
      var changed=(!!he!==!!state.hoverEdge)||
        (he && state.hoverEdge && (he.pi!==state.hoverEdge.pi||he.vi!==state.hoverEdge.vi));
      state.hoverEdge=he?{pi:he.pi,vi:he.vi,point:he.point}:null;
      if(changed) scheduleDraw();
    }
    updateCoords(p.x,p.y);
  },true);

  el.addEventListener('pointerup',function(e){
    if(draggingNote){
      draggingNote=null;
      viewer.setMouseNavEnabled(true);
      e.stopPropagation(); return;
    }
    if(drag){
      drag=null;
      viewer.setMouseNavEnabled(true);
      e.stopPropagation(); return;
    }
    if(!downPt) return;
    var moved=downPt.moved;
    downPt=null;
    if(moved) return;
    var p=localXY(e);
    handleClick(p.x,p.y,e);
  },true);

  el.addEventListener('dblclick',function(e){
    if(state.readonly) return;
    if(state.drawing){ finishDrawing(); e.stopPropagation(); e.preventDefault(); }
  },true);

  el.addEventListener('contextmenu',function(e){
    if(state.readonly) return;
    var p=localXY(e);
    var vi=hitVertex(p.x,p.y);
    if(vi!==null && state.sel){
      e.preventDefault();
      var ring=state.sel.polys[vi.pi];
      if(ring.length<=3){ toast('У зоны должно остаться минимум 3 точки'); return; }
      ring.splice(vi.vi,1);
      state.hoverEdge=null;
      renderProps(); scheduleDraw();
      toast('Точка удалена');
    }
  },true);
}

function handleClick(px,py,e){
  if(state.readonly){
    var rz=hitZoneScreen(px,py);
    if(rz){ select(rz); return; }
    var rn=hitNote(px,py);
    if(rn){ select(rn); return; }
    select(null);
    return;
  }

  if(state.placingNote){
    var nn=s2n(px,py);
    var note={ id:uid(), n:'Заметка '+(state.notes.length+1), text:'',
               img:null, color:state.color, nx:nn[0], ny:nn[1],
               floor:state.floor, on:true };
    state.notes.push(note);
    state.placingNote=false;
    document.body.classList.remove('placing');
    $('hint').classList.remove('show');
    select(note);
    renderProps();
    toast('Заметка добавлена — впишите текст и добавьте логотип');
    return;
  }

  if(state.drawing){
    var n=s2n(px,py);
    if(state.drawing.cur.length>=3){
      var f=n2s(state.drawing.cur[0][0],state.drawing.cur[0][1]);
      if(Math.hypot(px-f.x,py-f.y)<12){ finishDrawing(); return; }
    }
    state.drawing.cur.push([n[0],n[1]]);
    scheduleDraw();
    return;
  }

  if(state.sel && state.zones.indexOf(state.sel)>=0){
    var hv=hitVertex(px,py);
    if(hv===null){
      var he=edgeHit(px,py);
      if(he && he.d<10){
        state.sel.polys[he.pi].splice(he.vi+1,0,[he.point[0],he.point[1]]);
        state.hoverEdge=null;
        toast('Точка добавлена');
        scheduleDraw();
        return;
      }
    }
  }

  var z=hitZoneScreen(px,py);
  if(z){ select(z); return; }
  var nt=hitNote(px,py);
  if(nt){ select(nt); return; }
  select(null);
}

var coordT=null;
function updateCoords(px,py){
  clearTimeout(coordT);
  coordT=setTimeout(function(){
    var n=s2n(px,py);
    var sh=imgShift(state.floor);
    var g=imageToGame(n[0]*W-sh.x, n[1]*H-sh.y, 0);
    $('coords').innerHTML='клетка <b>'+g.x+' × '+g.y+'</b>'+(state.floor?' · эт. '+state.floor:'');
  },60);
}

/* ======================= создание зоны ======================= */
function startDrawing(){
  if(state.readonly) return;
  state.drawing={ cur:[], floor:state.floor };
  state.sel=null;
  state.placingNote=false;
  document.body.classList.add('drawing');
  document.body.classList.remove('placing');
  showHint('Клик — точка · <span class="k">Enter</span> — готово · <span class="k">Esc</span> — отмена');
  renderList(); renderProps(); scheduleDraw();
}
function cancelDrawing(){
  state.drawing=null; state.hover=null;
  document.body.classList.remove('drawing');
  $('hint').classList.remove('show');
  scheduleDraw();
}
function finishDrawing(){
  var d=state.drawing;
  if(!d) return;
  if(d.cur.length<3){ toast('Нужно минимум 3 точки'); return; }

  var z={ id:uid(), n:'Зона '+(state.zones.length+1), color:state.color,
          o:state.opacity, floor:d.floor, on:true, polys:[d.cur.slice()] };
  state.zones.push(z);
  state.drawing=null; state.hover=null;
  document.body.classList.remove('drawing');
  $('hint').classList.remove('show');

  var merged=false;
  for(var i=0;i<state.zones.length;i++){
    var o=state.zones[i];
    if(o===z || o.floor!==z.floor) continue;
    if(zonesTouch(z,o)){ mergeZones(z,o); merged=true; break; }
  }
  if(merged){
    autoMergeAll(true);
    select(state.zones.indexOf(z)>=0?z:state.sel);
    toast('Зона создана и объединена с соседней');
  }else{
    select(z);
    toast('Зона создана');
  }
}
function showHint(html){
  var h=$('hint');
  if(!h) return;
  h.innerHTML=html;
  h.classList.add('show');
}

function pickNoteImage(){
  if(state.readonly) return;
  if(!state.sel || state.notes.indexOf(state.sel)<0) return;
  $('imgInput').click();
}
function readImageFile(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var MAX=160;
      var s=Math.min(1,MAX/Math.max(im.width,im.height));
      var w=Math.max(1,Math.round(im.width*s)), h=Math.max(1,Math.round(im.height*s));
      var c=document.createElement('canvas');
      c.width=w; c.height=h;
      var g=c.getContext('2d');
      g.imageSmoothingQuality='high';
      g.drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/png'));
    };
    im.onerror=function(){ cb(null); };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function setNoteImg(dataUrl){
  if(!state.sel || !dataUrl) return;
  state.sel.img=dataUrl;
  var im=new Image(); im.src=dataUrl;
  noteImgs[state.sel.id]=im;
  renderNoteImg(); renderList(); scheduleDraw();
}

/* ======================= данные ======================= */
function b64url(bytes){
  var s='', chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk){
    s+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  }
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4) str+='=';
  var bin=atob(str), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

function serialize(){
  return {
    zones: state.zones.map(function(z){
      return { n:z.n, color:z.color, o:z.o, on:z.on!==false, floor:z.floor||0, polys:z.polys };
    }),
    notes: state.notes.map(function(n){
      return { n:n.n, text:n.text||'', img:n.img||null, color:n.color,
               nx:n.nx, ny:n.ny, floor:n.floor||0, on:n.on!==false };
    })
  };
}

async function pack(){
  var bytes=new TextEncoder().encode(JSON.stringify(serialize()));
  if(window.CompressionStream){
    try{
      var st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      var buf=new Uint8Array(await new Response(st).arrayBuffer());
      return 'd'+b64url(buf);
    }catch(_){}
  }
  return 'j'+b64url(bytes);
}
async function unpack(str){
  var data=unb64url(str.slice(1));
  var json;
  if(str[0]==='d' && window.DecompressionStream){
    var st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    json=await new Response(st).text();
  }else{
    json=new TextDecoder().decode(data);
  }
  return JSON.parse(json);
}

function normalizePayload(p){
  if(Array.isArray(p)) p={ zones:p, notes:[] };
  var zones=(p.zones||[]).map(function(a){
    var polys=a.polys?a.polys:[a.pts||[]];
    return { id:uid(), n:a.n||'Зона', color:a.color||a.c||COLORS[0],
             o:a.o||a.opacity||0.42, floor:a.floor||0, on:a.on!==false, polys:polys };
  }).filter(function(z){ return z.polys.length && z.polys[0].length>=3; });

  var notes=(p.notes||[]).map(function(a){
    return { id:uid(), n:a.n||'Заметка', text:a.text||'', img:a.img||null,
             color:a.color||COLORS[0], nx:a.nx, ny:a.ny,
             floor:a.floor||0, on:a.on!==false };
  });
  return { zones:zones, notes:notes, view:p.view||null };
}

function applyPayload(p){
  var n=normalizePayload(p);
  state.zones=n.zones;
  state.notes=n.notes;
  noteImgs={};
  state.notes.forEach(function(nt){
    if(nt.img){ var im=new Image(); im.src=nt.img; noteImgs[nt.id]=im; }
  });
  state.sel=null;
  renderList(); renderProps(); scheduleDraw();
  return n;
}

/* ======================= файл для игроков ======================= */
function saveStandaloneHTML(){
  try{
    var data=serialize();

    /* позиция вида, чтобы у игрока карта открылась там же, где её оставили */
    var it=refItem();
    if(it){
      var c=it.viewportToImageCoordinates(viewer.viewport.getCenter(true));
      var sh=imgShift(state.floor);
      var g=imageToGame(c.x-sh.x, c.y-sh.y, 0);
      var zoom=Math.max(1,Math.round(it.viewportToImageZoom(viewer.viewport.getZoom(true))*ZS));
      data.view={ gx:g.x, gy:g.y, zoom:zoom, floor:state.floor };
    }

    var payload=JSON.stringify(data)
      .replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');

    var injected='<script id="baked-data" type="application/json">'+payload+'<\/script>';
    var html=PRISTINE_HTML.replace('<body>','<body>\n'+injected);

    if(html.indexOf('baked-data')===-1){
      toast('Не удалось собрать файл');
      return;
    }
    if(html.indexOf('PRISTINE_HTML')===-1){
      // защита: в файл должен попасть код карты
      toast('Не удалось собрать файл');
      return;
    }

    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='kazachokkk-map.html';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);

    toast('Файл для игроков готов: зоны внутри, редактирование отключено');
  }catch(e){
    console.error(e);
    toast('Не удалось собрать файл');
  }
}

function exportJSON(){
  var data=JSON.stringify(serialize(),null,1);
  var blob=new Blob([data],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='zones.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  toast('Файл zones.json сохранён');
}

async function buildShareURL(){
  var h='#';
  var it=refItem();
  if(it){
    var c=it.viewportToImageCoordinates(viewer.viewport.getCenter(true));
    var sh=imgShift(state.floor);
    var g=imageToGame(c.x-sh.x, c.y-sh.y, 0);
    var zoom=Math.max(1,Math.round(it.viewportToImageZoom(viewer.viewport.getZoom(true))*ZS));
    h+=Math.round(g.x)+'x'+Math.round(g.y)+'x'+zoom+'x'+state.floor;
  }
  h+='&z='+await pack()+'&view=1';
  return location.origin+location.pathname+location.search+h;
}

function parseHash(){
  var raw=location.hash.replace(/^#/,'');
  if(!raw) return null;
  var h=decodeURIComponent(raw);
  var parts=h.split('&'), out={};
  var v=parts[0].split('x').map(Number);
  if(v.length>=2 && v.every(function(n){ return Number.isFinite(n); })){
    out.gx=v[0]; out.gy=v[1]; out.zoom=v[2]; out.floor=v[3]||0;
  }
  parts.forEach(function(s){
    if(s.indexOf('z=')===0) out.pack=s.slice(2);
    if(s==='view'||s==='view=1') out.view=true;
  });
  return out;
}

function goTo(gx,gy,zoom,floor){
  var it=refItem(); if(!it) return;
  var sh=imgShift(floor||0);
  var p=gameToImage(gx,gy,0);
  var vp=it.imageToViewportCoordinates(p.x+sh.x, p.y+sh.y);
  if(zoom) viewer.viewport.zoomTo(it.imageToViewportZoom(zoom/ZS),vp,true);
  viewer.viewport.panTo(vp,true);
  try{ viewer.viewport.applyConstraints(); }catch(_){}
  scheduleDraw();
}

    $('opVal').textContent=this.value+'%';
    if(!state.sel||state.readonly||state.zones.indexOf(state.sel)<0) return;
    state.sel.o=+this.value/100;
    scheduleDraw();
  });

  $('btnMerge').onclick=function(){
    if(!state.sel||state.readonly||state.zones.indexOf(state.sel)<0) return;
    var before=state.zones.length;
    autoMergeAll(true); autoMergeAll(true);
    var after=state.zones.length;
    renderList(); renderProps(); scheduleDraw();
    toast(after<before?('Объединено, зон стало: '+after):'Соседних зон не найдено');
  };

  $('btnDel').onclick=function(){
    if(!state.sel||state.readonly) return;
    state.zones=state.zones.filter(function(z){ return z!==state.sel; });
    state.notes=state.notes.filter(function(n){ return n!==state.sel; });
    state.sel=null;
    renderList(); renderProps(); scheduleDraw();
    toast('Удалено');
  };

  $('coords').onclick=async function(){
    if(state.readonly) return;
    try{ copy(await buildShareURL()); }catch(_){}
  };

  $('fileInput').addEventListener('change',function(){
    var f=this.files&&this.files[0];
    if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        applyPayload(JSON.parse(fr.result));
        toast('Загружено: зон '+state.zones.length+', заметок '+state.notes.length);
      }catch(e){ toast('Не удалось прочитать файл'); }
    };
    fr.readAsText(f);
    this.value='';
  });

  document.addEventListener('keydown',function(e){
    var tag=document.activeElement.tagName;
    if(e.key==='Escape'){
      if(state.drawing) cancelDrawing();
      else if(state.placingNote){
        state.placingNote=false;
        document.body.classList.remove('placing');
        $('hint').classList.remove('show');
      }
      else select(null);
    }
    if(e.key==='Enter' && state.drawing) finishDrawing();
    if((e.key==='Delete'||e.key==='Backspace') && !state.readonly && state.sel &&
       tag!=='INPUT' && tag!=='TEXTAREA'){
      e.preventDefault();
      $('btnDel').click();
    }
    if(!state.drawing && tag!=='INPUT' && tag!=='TEXTAREA'){
      if(e.key==='PageUp'||e.key===',') setFloor(state.floor+1);
      if(e.key==='PageDown'||e.key==='.') setFloor(state.floor-1);
    }
  });

  window.addEventListener('resize',resizeCanvas);
}

function copy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('Ссылка для игроков скопирована');
    }).catch(function(){ fallbackCopy(text); });
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Ссылка для игроков скопирована'); }
  catch(e){ prompt('Скопируйте ссылку:',text); }
  document.body.removeChild(ta);
}

function resizeCanvas(){
  var c=$('overlay');
  dpr=Math.min(devicePixelRatio||1,2);
  c.width=Math.floor(innerWidth*dpr);
  c.height=Math.floor(innerHeight*dpr);
  c.style.width=innerWidth+'px';
  c.style.height=innerHeight+'px';
  scheduleDraw();
}

/* ======================= запуск ======================= */
function loadScript(url){
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=url; s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
}
async function loadLibs(){
  var osd=[
    'https://cdn.jsdelivr.net/npm/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js',
    'https://unpkg.com/openseadragon@4.1.1/build/openseadragon/openseadragon.min.js'
  ];
  for(var i=0;i<osd.length;i++){
    try{ await loadScript(osd[i]); if(window.OpenSeadragon) break; }catch(_){}
  }
  OSD=window.OpenSeadragon;

  var pc=[
    'https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.js',
    'https://unpkg.com/polygon-clipping@0.15.7/dist/polygon-clipping.umd.js'
  ];
  for(var j=0;j<pc.length;j++){
    try{ await loadScript(pc[j]); if(window.polygonClipping) break; }catch(_){}
  }
}

async function loadData(){
  var h=parseHash();
  var isView=!!(h&&h.view);
  var baked=document.getElementById('baked-data');
  var isBaked=!!(baked&&baked.textContent.trim());
  var view=null;

  if(h && h.pack){
    try{
      var payload=await unpack(h.pack);
      var n=applyPayload(payload);
      view=n.view;
    }catch(e){ console.warn('ссылка',e); }
  }else if(isBaked){
    try{
      var d=JSON.parse(baked.textContent);
      var n2=applyPayload(d);
      view=n2.view;
      if(!h) h=d.view||null;
    }catch(e){ console.warn('вшитые данные',e); }
  }

  if(isBaked||isView) setReadonly(true);

  // у игрока карта открывается там же, где её оставил автор
  var pos = (h&&h.gx!=null&&h.gx!==undefined) ? h : (view||null);
  if(pos){
    if(pos.floor) setFloor(pos.floor);
    if(pos.gx!=null) goTo(pos.gx,pos.gy,pos.zoom,pos.floor);
  }
  renderList();
  scheduleDraw();
}

async function init(){
  await loadLibs();

  if(!OSD){
    $('loading').innerHTML='<div style="color:#8b98a6;font-size:13px;text-align:center;max-width:380px;line-height:1.7">'+
      'Не удалось загрузить движок карты.<br>Проверьте интернет и обновите страницу.</div>';
    return;
  }

  viewer=OSD({
    id:'viewer',
    showNavigator:false,
    showRotationControl:false,
    showFullPageControl:false,
    showHomeControl:false,
    showZoomControl:false,
    gestureSettingsMouse:{ clickToZoom:false, dblClickToZoom:false, flickEnabled:true },
    visibilityRatio:0.4,
    constrainDuringPan:true,
    minZoomImageRatio:0.55,
    maxZoomPixelRatio:4,
    animationTime:0.6,
    springStiffness:9,
    imageLoaderLimit:12,
    preserveViewport:true
  });

  syncFloors();

  viewer.addHandler('open',function(){ hideLoading(); scheduleDraw(); });
  viewer.addHandler('animation',scheduleDraw);
  viewer.addHandler('animation-finish',scheduleDraw);
  viewer.addHandler('update-viewport',scheduleDraw);
  viewer.addHandler('resize',scheduleDraw);
  viewer.addHandler('tile-loaded',function(){ hideLoading(); });

  setTimeout(hideLoading,5000);

  ctx=$('overlay').getContext('2d');
  resizeCanvas();
  attachInteraction();
  buildFloors();
  buildSwatches();
  bindUI();

  await waitFirstFloor();
  await loadData();
  scheduleDraw();
}

init();
})();
</script></body></html>
